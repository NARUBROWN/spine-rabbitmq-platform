name: CI
on:
  push:
    branches: [preview, rc, main]
  pull_request:
    branches: [preview, rc, main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      public_dependencies:
        type: boolean
        default: false
    outputs:
      verified_sha:
        value: ${{ jobs.verified.outputs.sha }}
permissions:
  contents: read
env:
  GOWORK: 'off'
jobs:
  direction:
    name: ${{ github.event_name == 'pull_request' && format('Branch Flow / {0}', github.base_ref) || 'Branch Direction' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: node scripts/release/branch_flow.cjs
  verify:
    needs: direction
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - name: Read bootstrap core source
        if: ${{ !inputs.public_dependencies }}
        id: core
        shell: bash
        run: python3 -c "import json,os; p=json.load(open('.github/release-policy.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('sha='+p['ci_core']+'\n')"
      - uses: actions/checkout@v4
        if: ${{ !inputs.public_dependencies }}
        with:
          repository: NARUBROWN/spine
          ref: ${{ steps.core.outputs.sha }}
          path: spine-core
          persist-credentials: false
      - name: Prepare bootstrap source workspace
        if: ${{ !inputs.public_dependencies }}
        shell: bash
        run: |
          python3 scripts/release/ci_workspace.py prepare --root . --output "$RUNNER_TEMP/contracts.work"
      - name: Check exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Go formatting
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Module boundary
        if: ${{ runner.os == 'Linux' }}
        run: bash scripts/check-module-boundary.sh
      - name: Policy and controller tests
        shell: bash
        run: |
          python3 scripts/release/release.py validate-policy
          python3 -m unittest discover -s test/release -p 'test_*.py'
          node --test scripts/release/branch_flow.test.cjs
          node scripts/release/branch_flow.cjs
      - name: Verify dependency channel
        shell: bash
        env:
          CHANNEL_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          channel=$(python3 -c "import sys; sys.path.insert(0,'scripts/release'); from ci_workspace import channel_for; import os; print(channel_for(os.environ['CHANNEL_REF']))")
          python3 scripts/release/release.py check-module --channel "$channel"
      - name: Check public module reproducibility
        if: ${{ inputs.public_dependencies }}
        shell: bash
        run: |
          go mod tidy
          go mod verify
          git diff --exit-code -- go.mod go.sum
          test -z "$(go list -m -f '{{if .Replace}}{{.Path}}{{end}}' all)"
      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./... -count=1 -shuffle=on -timeout=5m
      - name: Race detector
        if: ${{ runner.os == 'Linux' }}
        run: go test -race ./... -count=1 -shuffle=on -timeout=5m
  verified:
    name: ${{ github.event_name == 'pull_request' && format('Verified Source / {0}', github.base_ref) || 'Verified Source' }}
    if: ${{ always() }}
    needs: [direction, verify, live]
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Require source verification
        id: source
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
          DIRECTION: ${{ needs.direction.result }}
          RESULT: ${{ needs.verify.result }}
          LIVE_RESULT: ${{ needs.live.result }}
          PUBLIC: ${{ inputs.public_dependencies }}
        run: |
          test "$DIRECTION" = success
          test "$RESULT" = success
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          test "$LIVE_RESULT" = success
  live:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Read bootstrap core source
        if: ${{ !inputs.public_dependencies }}
        id: core
        shell: bash
        run: python3 -c "import json,os; p=json.load(open('.github/release-policy.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('sha='+p['ci_core']+'\n')"
      - uses: actions/checkout@v4
        if: ${{ !inputs.public_dependencies }}
        with:
          repository: NARUBROWN/spine
          ref: ${{ steps.core.outputs.sha }}
          path: spine-core
          persist-credentials: false
      - name: Prepare bootstrap source workspace
        if: ${{ !inputs.public_dependencies }}
        shell: bash
        run: |
          python3 scripts/release/ci_workspace.py prepare --root . --output "$RUNNER_TEMP/contracts.work"
      - name: Broker delivery contract
        env:
          SPINE_TEST_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
        run: go test -race . -run '^TestLive' -count=1 -timeout=2m
